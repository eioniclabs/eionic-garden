<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eionic Garden — Map Replay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080b10;
    color: #c8d0e0;
    font-family: 'Consolas', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #0e1520;
    border-bottom: 1px solid #1e2a3a;
    flex-shrink: 0;
  }
  #topbar h1 { font-size: 13px; color: #6090c0; letter-spacing: 2px; }
  #file-btn {
    padding: 4px 12px;
    background: #1a3050;
    border: 1px solid #2a4a70;
    color: #80b0d0;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
  }
  #file-btn:hover { background: #243a55; }
  #tick-display {
    font-size: 12px;
    color: #8090a0;
    margin-left: auto;
  }
  #moon-display { font-size: 13px; color: #9090c0; }

  /* ── MAIN LAYOUT ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── MAP ── */
  #map-wrap {
    position: relative;
    flex-shrink: 0;
  }
  #map-canvas {
    display: block;
    background: #080b10;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow-y: auto;
    min-width: 260px;
    max-width: 320px;
    border-left: 1px solid #1e2a3a;
  }

  .avatar-card {
    background: #0e1520;
    border: 1px solid #1e2a3a;
    border-radius: 4px;
    padding: 8px 10px;
  }
  .avatar-card .av-name {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
  }
  .av-action {
    font-size: 11px;
    color: #70a090;
    margin-bottom: 4px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .bar-label { font-size: 10px; color: #506070; width: 14px; }
  .bar-track {
    flex: 1;
    height: 4px;
    background: #1a2030;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .av-zone { font-size: 10px; color: #506070; margin-top: 4px; }
  .av-flags { font-size: 10px; color: #8060a0; margin-top: 2px; }
  .av-valence { font-size: 11px; margin-top: 4px; }

  /* ── CONTROLS ── */
  #controls {
    flex-shrink: 0;
    padding: 8px 16px;
    background: #0e1520;
    border-top: 1px solid #1e2a3a;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ctrl-btn {
    padding: 4px 14px;
    background: #1a3050;
    border: 1px solid #2a4a70;
    color: #80b0d0;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
  }
  .ctrl-btn:hover { background: #243a55; }
  .ctrl-btn.active { background: #204060; border-color: #4080b0; }

  #scrubber {
    flex: 1;
    accent-color: #4080b0;
    cursor: pointer;
  }
  #speed-label { font-size: 11px; color: #506070; }
  #progress-label { font-size: 11px; color: #506070; min-width: 90px; text-align: right; }

  /* ── LOADING ── */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #080b10;
    color: #405060;
    font-size: 13px;
    gap: 10px;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>◈ EIONIC GARDEN — MAP REPLAY</h1>
  <input type="file" id="file-input" accept=".txt" style="display:none">
  <button class="ctrl-btn" id="file-btn" onclick="document.getElementById('file-input').click()">
    Load map_log.txt
  </button>
  <span id="moon-display"></span>
  <span id="tick-display">No log loaded</span>
</div>

<!-- MAIN -->
<div id="main">
  <div id="map-wrap">
    <canvas id="map-canvas"></canvas>
    <div id="loading">
      <div>◈ EIONIC GARDEN</div>
      <div style="font-size:11px">Load map_log.txt to begin replay</div>
    </div>
  </div>

  <div id="sidebar">
    <div style="font-size:11px;color:#304050;padding:4px 0">AVATAR STATE</div>
    <div id="avatar-cards"></div>
  </div>
</div>

<!-- CONTROLS -->
<div id="controls">
  <button class="ctrl-btn" id="btn-prev" onclick="stepBy(-1)">◀</button>
  <button class="ctrl-btn active" id="btn-play" onclick="togglePlay()">▶ PLAY</button>
  <button class="ctrl-btn" id="btn-next" onclick="stepBy(1)">▶</button>
  <input type="range" id="scrubber" min="0" value="0" oninput="scrubTo(this.value)">
  <span id="speed-label">1×</span>
  <button class="ctrl-btn" onclick="cycleSpeed()">SPEED</button>
  <span id="progress-label">0 / 0</span>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
let ticks = [];       // [{tick, sim_time, lunar, avatars:[{...}]}]
let current = 0;
let playing  = false;
let speed    = 1;     // frames per step
const SPEEDS = [1, 3, 8, 20];
let frameCount = 0;
let animId = null;

// ── ZONE CONFIG ───────────────────────────────────────────────────────────────
const ZONES = {
  sanctuary:   { x0:0,  x1:40,  y0:0,  y1:40,  color:'#0a2030', accent:'#3080b0' },
  nexus:       { x0:40, x1:70,  y0:40, y1:70,  color:'#1a1000', accent:'#c08020' },
  void:        { x0:70, x1:100, y0:0,  y1:40,  color:'#08051a', accent:'#6030a0' },
  chaos_field: { x0:70, x1:100, y0:60, y1:100, color:'#1a0505', accent:'#c03020' },
  earth_zone:  { x0:0,  x1:40,  y0:60, y1:100, color:'#0a1505', accent:'#3a8030' },
};

const ACTION_COLORS = {
  Rest:'#40c878',Withdraw:'#6478c8',Harmonize:'#ff96c8',Seek:'#ffc832',
  Confront:'#ff5032',Transform:'#c850ff',Create:'#ffdc64',Think:'#96c8ff',
  Observe:'#b4deb4',Move:'#ffa050',Speak:'#c8ffc8',Accept:'#96ffb4',
  Reject:'#ff7850',Wait:'#787888',
};

const MOON_ICONS = {
  new_moon:'🌑',waxing_crescent:'🌒',first_quarter:'🌓',waxing_gibbous:'🌔',
  full_moon:'🌕',waning_gibbous:'🌖',last_quarter:'🌗',waning_crescent:'🌘',
};

// ── PARSER ────────────────────────────────────────────────────────────────────
function parseLog(text) {
  const lines  = text.split('\n');
  const result = [];
  let cur = null;

  for (let line of lines) {
    // Tick header: T:000001 | 2025-01-01 00:00 | new_moon
    const th = line.match(/^T:(\d+)\s*\|\s*([^\|]+?)(?:\s*\|\s*(\S+))?\s*$/);
    if (th) {
      if (cur) result.push(cur);
      cur = {
        tick:     parseInt(th[1]),
        sim_time: th[2].trim(),
        lunar:    th[3] ? th[3].trim() : '',
        avatars:  [],
      };
      continue;
    }

    // Avatar line: "  BlueY      ( 18.0, 22.0)  sanctuary    Rest        E:0.72  C:0.55 ..."
    const al = line.match(
      /^\s+(\S+)\s+\(\s*([\d.]+)\s*,\s*([\d.]+)\s*\)\s+(\S+)\s+(\S+)\s+E:([\d.]+)\s+C:([\d.]+)\s+D:([\d.]+)\s+V:([+-][\d.]+)(.*)/
    );
    if (al && cur) {
      const flags = al[10].trim();
      cur.avatars.push({
        name:    al[1],
        x:       parseFloat(al[2]),
        y:       parseFloat(al[3]),
        zone:    al[4],
        action:  al[5],
        energy:  parseFloat(al[6]),
        cortisol:parseFloat(al[7]),
        dopamine:parseFloat(al[8]),
        valence: parseFloat(al[9]),
        flags:   flags,
        shadow:  flags.includes('◆'),
        protocol:flags.match(/\[(\w+)\]/)?.[1] || null,
        target:  flags.match(/→(\S+)/)?.[1] || null,
      });
    }
  }
  if (cur) result.push(cur);
  return result;
}

// ── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('map-canvas');
const ctx    = canvas.getContext('2d');
let W = 600, H = 600;

function resizeCanvas() {
  const wrap = document.getElementById('map-wrap');
  const avail = Math.min(window.innerHeight - 90, window.innerWidth - 340);
  W = H = Math.max(300, avail);
  canvas.width  = W;
  canvas.height = H;
  wrap.style.width  = W + 'px';
  wrap.style.height = H + 'px';
  if (ticks.length) renderFrame(current);
}

function wx(x) { return x / 100 * W; }
function wy(y) { return y / 100 * H; }

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderFrame(idx) {
  if (!ticks.length) return;
  const frame = ticks[idx];
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#080b10';
  ctx.fillRect(0, 0, W, H);

  // Zones
  for (const [name, z] of Object.entries(ZONES)) {
    ctx.fillStyle = z.color;
    ctx.fillRect(wx(z.x0), wy(z.y0), wx(z.x1 - z.x0), wy(z.y1 - z.y0));
    ctx.strokeStyle = z.accent + '40';
    ctx.lineWidth = 1;
    ctx.strokeRect(wx(z.x0)+0.5, wy(z.y0)+0.5, wx(z.x1-z.x0)-1, wy(z.y1-z.y0)-1);

    // Zone label
    ctx.fillStyle = z.accent + '60';
    ctx.font = `${Math.max(9, W/80)}px Consolas`;
    ctx.fillText(name.toUpperCase(), wx(z.x0) + 5, wy(z.y0) + 14);
  }

  // Connection lines between nearby avatars
  for (let i = 0; i < frame.avatars.length; i++) {
    for (let j = i+1; j < frame.avatars.length; j++) {
      const a = frame.avatars[i], b = frame.avatars[j];
      const dx = wx(a.x) - wx(b.x), dy = wy(a.y) - wy(b.y);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < W * 0.18) {
        const alpha = Math.max(0, 0.15 - dist/(W*0.18) * 0.15);
        ctx.strokeStyle = `rgba(100,160,200,${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(wx(a.x), wy(a.y));
        ctx.lineTo(wx(b.x), wy(b.y));
        ctx.stroke();
      }
    }
  }

  // Avatars
  const R = Math.max(8, W / 50);
  for (const av of frame.avatars) {
    const sx = wx(av.x), sy = wy(av.y);
    const r  = R * (0.7 + av.energy * 0.6);

    // Avatar body color from hormones
    const cr = Math.min(255, 60 + av.cortisol * 140 + av.dopamine * 55);
    const cg = Math.min(255, 60 + (1-av.cortisol) * 100 + av.dopamine * 60);
    const cb = Math.min(255, 100 + av.dopamine * 80);
    const bodyColor = `rgb(${~~cr},${~~cg},${~~cb})`;

    // Shadow darkens the body
    const shadowFactor = av.shadow ? 0.5 : 1.0;

    // Glow from action
    const glowCol = ACTION_COLORS[av.action] || '#808080';
    const glow = ctx.createRadialGradient(sx,sy,r*0.5, sx,sy, r*2.5);
    glow.addColorStop(0, glowCol + '40');
    glow.addColorStop(1, glowCol + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, r*2.5, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    const sf = shadowFactor;
    ctx.fillStyle = `rgb(${~~(cr*sf)},${~~(cg*sf)},${~~(cb*sf)})`;
    ctx.fill();

    // Outline based on valence
    if (av.valence > 0.25)       ctx.strokeStyle = '#60d090';
    else if (av.valence < -0.25) ctx.strokeStyle = '#d05040';
    else                         ctx.strokeStyle = '#809090';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Protocol spinning dot
    if (av.protocol) {
      const angle = (Date.now() / 800) % (Math.PI * 2);
      const pr = r + 5;
      ctx.beginPath();
      ctx.arc(sx + pr*Math.cos(angle), sy + pr*Math.sin(angle), 2.5, 0, Math.PI*2);
      ctx.fillStyle = '#64ffa0';
      ctx.fill();
    }

    // Energy bar
    const bw = r * 2.2, bh = 3;
    const bx = sx - bw/2, by = sy - r - 9;
    ctx.fillStyle = '#162030';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#40c870';
    ctx.fillRect(bx, by, bw * av.energy, bh);

    // Name
    ctx.font = `bold ${Math.max(9, W/75)}px Consolas`;
    ctx.fillStyle = '#d0dde8';
    ctx.textAlign = 'center';
    ctx.fillText(av.name, sx, sy + r + 12);

    // Action
    ctx.font = `${Math.max(8, W/85)}px Consolas`;
    ctx.fillStyle = glowCol;
    ctx.fillText(av.action, sx, sy + r + 22);

    ctx.textAlign = 'left';
  }

  // Tick overlay
  ctx.font = `10px Consolas`;
  ctx.fillStyle = '#30405060';
  ctx.fillText(`T:${String(frame.tick).padStart(6,'0')}`, 6, H - 6);
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function updateSidebar(idx) {
  if (!ticks.length) return;
  const frame  = ticks[idx];
  const cards  = document.getElementById('avatar-cards');
  cards.innerHTML = '';

  for (const av of frame.avatars) {
    const glowCol = ACTION_COLORS[av.action] || '#808090';
    const valColor = av.valence > 0.15 ? '#50d080' : av.valence < -0.15 ? '#d05040' : '#808090';
    const card = document.createElement('div');
    card.className = 'avatar-card';
    card.innerHTML = `
      <div class="av-name" style="color:${glowCol}">${av.name}</div>
      <div class="av-action">${av.action}  <span style="color:#405060">${av.zone}</span></div>
      <div class="bar-row">
        <span class="bar-label" style="color:#40c870">E</span>
        <div class="bar-track"><div class="bar-fill" style="width:${av.energy*100}%;background:#40c870"></div></div>
      </div>
      <div class="bar-row">
        <span class="bar-label" style="color:#d05040">C</span>
        <div class="bar-track"><div class="bar-fill" style="width:${av.cortisol*100}%;background:#d05040"></div></div>
      </div>
      <div class="bar-row">
        <span class="bar-label" style="color:#ffc840">D</span>
        <div class="bar-track"><div class="bar-fill" style="width:${av.dopamine*100}%;background:#ffc840"></div></div>
      </div>
      <div class="av-valence" style="color:${valColor}">V: ${av.valence >= 0 ? '+' : ''}${av.valence.toFixed(2)}</div>
      ${av.flags ? `<div class="av-flags">${av.flags}</div>` : ''}
    `;
    cards.appendChild(card);
  }
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(idx) {
  if (!ticks.length) return;
  const frame = ticks[idx];
  const moon  = frame.lunar ? (MOON_ICONS[frame.lunar] || '◉') + ' ' + frame.lunar.replace(/_/g,' ') : '';
  document.getElementById('tick-display').textContent =
    `T:${String(frame.tick).padStart(6,'0')}  ${frame.sim_time}`;
  document.getElementById('moon-display').textContent = moon;
  document.getElementById('scrubber').value = idx;
  document.getElementById('progress-label').textContent = `${idx+1} / ${ticks.length}`;
}

// ── PLAYBACK ──────────────────────────────────────────────────────────────────
function go(idx) {
  current = Math.max(0, Math.min(ticks.length - 1, idx));
  renderFrame(current);
  updateSidebar(current);
  updateHUD(current);
}

function stepBy(n) { go(current + n); }
function scrubTo(v) { go(parseInt(v)); }

function togglePlay() {
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
  document.getElementById('btn-play').classList.toggle('active', playing);
  if (playing) animate();
}

function cycleSpeed() {
  const i = (SPEEDS.indexOf(speed) + 1) % SPEEDS.length;
  speed   = SPEEDS[i];
  document.getElementById('speed-label').textContent = `${speed}×`;
}

function animate() {
  if (!playing) return;
  frameCount++;
  if (frameCount % Math.max(1, Math.round(4 / speed)) === 0) {
    if (current >= ticks.length - 1) {
      playing = false;
      document.getElementById('btn-play').textContent = '▶ PLAY';
      return;
    }
    go(current + 1);
  }
  requestAnimationFrame(animate);
}

// ── FILE LOAD ─────────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    ticks = parseLog(ev.target.result);
    if (!ticks.length) {
      alert('No tick data found. Check the log format.');
      return;
    }
    document.getElementById('loading').classList.add('hidden');
    const scrubber = document.getElementById('scrubber');
    scrubber.max = ticks.length - 1;
    scrubber.value = 0;
    go(0);
  };
  reader.readAsText(file);
});

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === ' ')           { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight')  stepBy(1);
  if (e.key === 'ArrowLeft')   stepBy(-1);
  if (e.key === 'ArrowUp')     stepBy(10);
  if (e.key === 'ArrowDown')   stepBy(-10);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
